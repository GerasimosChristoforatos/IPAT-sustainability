# Register of every external input. status: verified = read by us from the cited
# source; pending = value not yet read from the source (must not be used; load.py refuses).
# Retrieval dates are ISO. "type": data | derived | stretched.

owid_co2:
  citation: "Ritchie, Rosado & Roser, Our World in Data CO2 and Greenhouse Gas Emissions dataset"
  url: https://github.com/owid/co2-data
  commit: 22d9a01321ddec951b36f2bfc66e05dc6ad50ad8
  file: data/raw/owid-co2-data.csv
  sha256: 300fb68fe6b0d514ed7f5cf773df77d7e24a495438d84b76e2f39eba1584a0f7
  codebook: data/raw/owid-co2-codebook.csv
  retrieved: 2026-11-13
  licence: CC BY 4.0
  status: verified
  variables:
    population: {unit: persons, upstream: "OWID population, various sources (2024)"}
    gdp: {unit: "international-$ at 2011 prices", upstream: "Maddison Project Database 2023 (Bolt & van Zanden)"}
    consumption_co2: {unit: "Mt CO2/yr", upstream: "Global Carbon Budget (2026); fossil CO2, excludes land-use change"}
    co2_including_luc: {unit: "Mt CO2/yr", upstream: "Global Carbon Budget (2026)"}
  notes: >
    2022 is the latest year with GDP. EU27 GDP is not provided as an aggregate and is
    summed over the 27 members (all present); member sums of population and consumption
    CO2 equal the OWID EU27 aggregate to 6 significant figures (checked in tests).

igcc_2025_rcb:
  citation: "Forster et al. (2026), Indicators of Global Climate Change 2025, Earth Syst. Sci. Data 18, 3889"
  doi: 10.5194/essd-18-3889-2026
  url: https://github.com/ClimateIndicator/data
  commit: d9726573dccd9381652432b58b38f670af493c1c
  file: data/raw/co2-budget_global_igcc-assessment_synthesis_table_IGCC-2025a.csv
  sha256: 146caa522a9be24ee9cf3b768f0e320944a79e4dadf6b68d6c659ee3fceac4b2
  dataset: "Remaining carbon budgets in 0.1 degC increments (R. Lamboll)"
  unit: "Gt CO2 from 1 Jan 2026"
  retrieved: 2026-11-13
  status: verified
  variant_choice: >
    The file holds three parameter variants (1.5 degC, 50 %: 98, 134, 188 Gt). We use
    'magicc_hdtbasis1.24_zecsd0.0' (134 Gt) because it is the one that rounds to the
    paper's headline of 130 Gt for 1.5 degC at 50 % from the start of 2026. The headline
    Confirmed against Table 8 of the paper (Sect. 9; values rounded to 10 Gt:
    1.5 degC 210/130/80, 1.7 degC 650/500/390, 2.0 degC 1310/1050/860 at 33/50/67 %),
    which the selected variant reproduces at every published likelihood. Table 8 states
    that the probability covers TCRE uncertainty only.
  conversion: "Unrounded file values are used in computation; linear interpolation between published likelihoods for the Monte Carlo."

velez_henao_2026:
  citation: "Velez-Henao, Streeck, Kikstra & Pauliuk (2026), Ecological Economics 240, 108819"
  doi: 10.1016/j.ecolecon.2025.108819
  retrieved: 2026-11-13
  access: "PDF supplied by the author of this study; not redistributed"
  status: verified
  values:
    dls_ghg_recent_tech: {value: 29, unit: "Gt CO2e/yr", year: 2015, where: "Sect. 3.5, first paragraph", type: data}
    dls_ghg_efficient:   {value: 14, unit: "Gt CO2e/yr", year: 2015, where: "Sect. 3.5 last paragraph; Sect. 4.1", type: data}
    current_ghg:         {value: 54, unit: "Gt CO2e/yr", year: 2015, where: "Sect. 4.1 (citing Forster et al. 2024)", type: data}
    dls_materials_recent_tech: {value: 35, unit: "Gt/yr", year: 2015, where: "Sect. 3.5", type: data}
    dls_materials_efficient:   {value: 24, unit: "Gt/yr", year: 2015, where: "Sect. 4.1", type: data}
    current_materials:   {value: 91, unit: "Gt/yr (RMC)", year: 2015, where: "Sect. 4.1 (citing UNEP IRP 2024)", type: data}
    population:          {value: 7.3e9, unit: persons, year: 2015, where: "Sect. 4.1", type: data}
  conversion: >
    phi = DLS requirement / current total, same year and unit (population cancels).
    Recent-technology scenario is the route estimate; the efficient scenario embeds
    low-carbon electricity (a change in T) and is shown for reference only.


whr_2026:
  citation: "Helliwell, Layard, Sachs, De Neve, Aknin & Wang (eds.) (2026), World Happiness Report 2026, Data for Figure 2.1"
  url: https://www.worldhappiness.report/data-sharing/
  file: data/raw/WHR26_Data_Figure_2.1.xlsx
  sha256: 576e382655cec3ae704a0b41cd2c04465b87cd84b7f131a0c4fa26d41f6d8028
  retrieved: 2026-11-13
  access: "file supplied by the study author (host blocked from build environment)"
  status: verified
  variables:
    "Life evaluation (3-year average)": {unit: "Cantril ladder, 0-10", type: data}
  notes: >
    One sheet, report years 2011-2025; 'Year' is the last year of the three-year window.
    Year 2023 (window 2021-2023) reproduces the WHR 2024 published scores (Finland 7.741,
    United States 6.725, Costa Rica 6.955) and is centred on the activity year 2022; it is
    the main ladder. Year 2025 (2023-2025) is the robustness row.

un_wpp_2024:
  citation: "United Nations DESA Population Division (2024), World Population Prospects 2024, Online Edition, File SA1/GEN/01"
  url: https://population.un.org/wpp/downloads
  file: data/raw/WPP2024_SA1_GEN_F01_DEMOGRAPHIC_INDICATORS.xlsx
  sha256: 4f1d9e732452ec66fc8da0ec563007e68066d905e82801cd8bad72ab9f6b5d15
  retrieved: 2026-11-13
  licence: CC BY 3.0 IGO
  status: verified
  variables:
    "Total Population, as of 1 July (thousands)": {unit: "thousand persons", variant: "Estimates / Medium", type: data}
  conversion: >
    The special-aggregates file has no World row. World = 'More developed regions'
    (location 901) + 'Less developed regions' (902), which partition the world. Check:
    the 2022 sum (8,021,407 thousand) equals the OWID world population. Peak = maximum of
    the annual series (10,289,315 thousand in 2084), computed in load.py.

pwc_nzei_2024:
  citation: "PwC (2024), Net Zero Economy Index 2024"
  url: https://www.pwc.ie/issues/environmental-social-governance-esg/net-zero-economy-index.html
  retrieved: 2026-11-13
  access: "PDF print of the PwC Ireland report page, supplied by the study author; not redistributed"
  status: partially verified
  v2_status: >
    v2.0 (2026-11-13): the PwC Ireland 2024 press release announced by the study author was
    not present in data/raw/papers/ or on the main branch when v2.0 was built. The three
    scenario rates therefore remain assumptions (config.yaml); BAU stays at 1.5 %/yr rather
    than the 1.43 % average, which could not be sourced from the supplied files.
  values:
    rate_2023: {value: 0.0102, unit: "per year", where: "opening paragraph", type: data, verified: true}
    rate_1p5c: {value: 0.204, unit: "per year", where: "opening paragraph", type: data, verified: true}
  notes: >
    Metric: energy-related CO2 per unit of GDP, production-based; not our consumption-based T.
    The supplied file does NOT contain the three scenario rates used here (1.5 %, 6.9 %,
    11.5 %). They are therefore treated as scenario ASSUMPTIONS fixed in config.yaml, taken
    from the study brief. Web-search snippets (2026-11-13; PwC UK and PwC Ireland press
    releases) corroborate 6.9 % for 2 degC and 'no G20 country above 11.5 % since 2000';
    they give the 2000-2023 average as 1.43 % (not 1.5 %), and the full report reportedly
    gives the largest G20 single-year rate as 11.08 % (France, 2014). Not read by us in a
    primary document. For comparison, world consumption-based T in our own data fell by
    1.76 %/yr between 2000 and 2022 (derived from owid_co2).

