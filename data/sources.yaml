hickel_sullivan_2024:
  citation: "Hickel & Sullivan (2024), How much growth is required to achieve good lives for all?, World Development Perspectives 35, 100612"
  doi: 10.1016/j.wdp.2024.100612
  retrieved: 2026-11-13
  access: "open access; PDF supplied by the study author"
  status: verified
  values:
    share_headline: {value: 0.30, unit: "share of current global resource and energy use", where: "Abstract", type: data}
    share_energy_low: {value: 0.30, unit: share, where: "Sect. 4: 125-183 EJ = 30-44 % of 418 EJ (2019)", type: data}
    share_energy_high: {value: 0.44, unit: share, where: "Sect. 4", type: data}
    share_materials_low: {value: 0.29, unit: share, where: "Sect. 4: 28-40 Gt = 29-42 % of 95 Gt (2019)", type: data}
    share_materials_high: {value: 0.42, unit: share, where: "Sect. 4", type: data}
    population: {value: 8.5e9, unit: persons, year: 2050, where: "Abstract; Sect. 4", type: data}
    reference_year: {value: 2019, unit: year, where: "Sect. 4", type: data}
  notes: >
    A synthesis, not an independent model: energy from Millward-Hopkins (2022), materials
    from Velez-Henao & Pauliuk (2023). Shares are totals for 8.5 bn people relative to the
